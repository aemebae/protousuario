<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CLON TRANSESPECIE — PROTOUSUARIO</title>
<style>
  :root{ --fondo:#0d0a10; --accent:#55ffa6; --accent-dim:#2b6b49; }
  html,body{margin:0;padding:0;height:100%;background:var(--fondo);overflow:hidden;}
  #lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #titulo{position:absolute;top:12px;left:14px;z-index:3;font:9px monospace;
    letter-spacing:.24em;text-transform:uppercase;color:var(--accent);opacity:.7;
    text-shadow:0 0 8px var(--accent-dim);pointer-events:none;}
  #carga{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    color:var(--accent-dim);font:10px monospace;letter-spacing:.2em;text-transform:uppercase;}
  #carga.oculto{display:none;}
  #diag{position:absolute;left:8px;bottom:8px;z-index:6;display:none;max-width:calc(100% - 16px);
    font:10px/1.5 monospace;color:var(--accent);background:rgba(13,10,16,.84);
    border:1px solid var(--accent-dim);padding:6px 8px;white-space:pre-wrap;pointer-events:none;}
  #toque{position:absolute;left:0;right:0;bottom:14px;z-index:7;display:none;text-align:center;
    font:10px monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);pointer-events:none;}
  #rotulo{position:absolute;right:10px;top:10px;z-index:6;display:none;max-width:60%;
    font:9px/1.6 monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    text-align:right;pointer-events:none;}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="titulo">CLON TRANSESPECIE</div>
<div id="carga">encarnando…</div>
<div id="diag"></div>
<div id="rotulo"></div>
<div id="toque">toca la pantalla una vez · así la boca escucha la voz</div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   CLON TRANSESPECIE — Capa de encarnación  ·  v4 (cierre de VIDEOAKT 5)
   PROTOUSUARIO / [AGENTE-ESPEJO] · Museo de la Nación

   QUÉ CAMBIÓ EN v4
   · Ninguna cabeza manda. En la v3 la cabeza dominante ocupaba en promedio
     el 36 % del rostro (hasta 69 %) en un bloque continuo: se leía como un
     animal base con fragmentos encima. Ahora cada celda prefiere la cabeza
     que MENOS celdas tiene en pantalla, con un tope duro por cabeza; el
     elenco es más grande (8) y los parches casi siempre de una celda.
     Además una cabeza evita caer junto a sí misma (SEPARA): los órganos
     no se juntan en una región. Medido en Chromium, toda la obra: la
     dominante promedia 15 % (máx. ~24 %), 10 cabezas a la vez, y el bloque
     más grande de una misma cabeza ~5 celdas (en la v3: 21 a 34).
   · La periferia se llena solo a veces: la silueta es irregular y respira.
   · Señora K solo existe dentro de su @CLON (SOLO_EN_SU_CLON).
   · Una cara de poder (Elite) no aparece como fragmento hasta que su @CLON
     la presenta (PODER_TRAS_SU_CLON): no se arruina la revelación.
   · @CLON figura s fin: la pérdida dura hasta que cierra el agente (el
     orquestador manda cuánto falta). Si el agente se alarga (manual, más
     lento), queda un RESTO de la figura (12 %, en fragmentos que cambian de
     sitio) hasta que de verdad entra el siguiente. Y un agente nuevo nunca
     hereda la figura del anterior: lo que quede se pierde en 2,5 s.
   · Mientras una figura se pierde, el resto del mosaico sigue mutando
     (antes quedaba quieto alrededor de ella).
   · Al terminar el séquito de la Señora K, los Monstruos se van en 1,4 s
     (antes tardaban y por un momento uno ocupaba el 45 % del rostro).
   · Solo en el Celular 2: si el audio está bloqueado, pide un toque.

   QUÉ CAMBIÓ EN v3
   · Ya NO hay cabeza base. El rostro es SIEMPRE un mosaico de fragmentos:
     cada celda es un pedazo de alguna cabeza del ELENCO (las 2 a 8 cabezas
     activas en ese momento). La silueta sale de la unión de esas cabezas,
     como en tus maquetas: orejas, antenas y aletas incluidas.
   · Retícula 11×11 de celdas CUADRADAS: es la de tus maquetas. Sus cortes
     caen en múltiplos de 93 px (1024/11) y la cara ocupa unas 8 columnas:
     de ahí el "8 × 11" que veías. La v2 partía el cuadro en 8 columnas
     (celdas de 128×93) que no calzaban con ningún corte tuyo.
   · Todo cambio es un CORTE. Ningún fundido, en ningún lado.
   · Los cambios van por PARCHES: 1 a 4 celdas vecinas de la misma cabeza en
     un solo corte, para que se armen órganos enteros (un hocico, un ojo con
     su mejilla) y no un tablero de ruido.
   · @CLON figura s: la cabeza se ARMA corte a corte hasta verse sola, se
     SOSTIENE s segundos y se PIERDE entre otras cabezas, continuamente.
   · Señora K se pierde SOLO entre sus Monstruos (01 y 02), que no aparecen
     en ningún otro momento de la obra (SEQUITO, más abajo).
   · @CLON vaciar: tu retrato aparece entre especies y se VACÍA celda a
     celda hasta que solo quedan especies. La muda.
   · rumbo: DESPLAZADO desarma la cara (celdas fuera de sitio, mutación más
     rápida, más cabezas); AUTORIZADO la consolida (todo en su sitio, más
     lento, menos cabezas). La autorización geopolítica es integridad.
   · @SILENCIO: la boca se cierra en el acto y el rostro se descompone muy
     despacio. Nunca sigue "hablando" por inercia. Tampoco habla si un bloque
     llega sin audio.
   · El título propio solo se ve cuando el clon está SOLO (Celular 2). Dentro
     de la escena compuesta ya hay uno: antes se pisaban los dos.

   SE CONSERVAN LOS CINCO CAMBIOS DE LA v2 (todos siguen aquí):
   · jvlix.png / julix.png: entra el que exista (ahora vale para cualquier
     imagen renombrada: ver la lista de respaldo y /clon-lista).
   · El clon croa: un @SONIDO pasa por el mismo analizador que la voz.
   · Una sola fuente conectada al analizador (se desconecta la anterior).
   · El analizador arranca solo (Chrome con --autoplay-policy=…).
   · @CLON desde la partitura (ahora con ensamble, sostén y pérdida).

   100 % offline. Sin API. Solo archivos locales.
   Demo sin orquestador:      /clon.html?demo=1        (teclas, ver abajo)
   Diagnóstico para ensayo:   /clon.html?diag=1        (se combina con demo)
   ═══════════════════════════════════════════════════════════════════════ */

/* ───────────────── AJUSTES: lo que se toca ───────────────── */
const COLS = 11, FILAS = 11, NN = COLS * FILAS, SRC = 1024;
const CARNE = 110;        // alfa medio de la celda: esa cabeza tiene cuerpo ahí
const RASGO = 22;         // tiene algo: punta de antena, oreja, aleta
const ENSAMBLE_S = 2.6;   // @CLON: lo que tarda la cabeza en armarse, corte a corte
const SOSTEN_S = 12;      // @CLON sin número
const PERDIDA_S = 24;     // lo que tarda la figura en perderse entre otras cabezas
const PERDIDA_MIN_S = 6;  // con "fin": la pérdida nunca dura menos que esto
const RESTO_FIN = 0.12;   // con "fin": lo que queda de la figura hasta que el agente cierra de verdad
const RESTO_MUEVE_S = 1.5;// ese resto no se queda pegado: un fragmento cambia de sitio cada 1,5 s
const CIERRE_RAPIDO_S = 2.5; // agente nuevo: lo que quede de la figura anterior se pierde en esto
const RETRATO_S = 4;      // @CLON vaciar: tu retrato completo antes de vaciarse
const VACIAR_S = 24;      // @CLON vaciar sin número: lo que dura el vaciado
const ELENCO_BASE = 8;    // cabezas activas a la vez (el perfil y el rumbo suman o restan)
const PESO_JVLIX = 2;     // tu rostro entra al elenco el doble de seguido
const PESO_GRANDE = 0.45; // las que llenan casi todo el cuadro (oso, cuy, capibara)
const TOPE_CABEZA = 1.6;  // ninguna cabeza pasa de 1,6 × su parte justa de celdas
const SEPARA = 1.5;       // cuánto evita una cabeza caer junto a sí misma (0 = nada)

// Cabezas de poder: entran al mosaico según el perfil del agente.
const PODER = ['elite', 'senora k', 'monstruo'];
// true: una cara de poder no aparece como fragmento hasta que su propio
// @CLON la presenta (Elite recién después de "@CLON Elite").
const PODER_TRAS_SU_CLON = true;
// Solo existen dentro de su propio @CLON. Nunca en el mosaico, nunca antes.
const SOLO_EN_SU_CLON = ['senora k'];
// Cabezas RESERVADAS: solo existen dentro de la figura dueña. Fuera de ella,
// nunca. Nombres sin .png, sin tildes ni mayúsculas, como en @CLON.
const SEQUITO = { 'senora k': ['monstruo 01', 'monstruo 02'] };
// true: Señora K se pierde SOLO entre sus Monstruos.
// false: se pierde entre todas las cabezas, Monstruos incluidos.
const SEQUITO_SOLO = true;

// ── Desfase de la boca (ver en el ensayo con ?diag=1) ──
// La copia silenciosa que mueve la boca se descarga aparte de la voz que suena.
// false = como siempre.  true = cuando la copia termina de descargarse, salta
// hasta donde ya va la voz real. También: ?sincro=1 o ?sincro=0 en la URL.
const SINCRO_BOCA = false;
const SINCRO_EXTRA_MS = 0;   // si aún va tarde, súmale aquí (o ?sincroms=80)
const RITMO_SILENCIO = 0.25; // en @SILENCIO el tiempo del rostro corre a un cuarto

/* Zona vocal: filas 6–7 × columnas 4–6. Ahí caen la boca de tu retrato, la
   de la Señora K, la de Elite, los labios de la Yakuruna, el pico del cóndor.
   Late con la voz SEA CUAL SEA el órgano que ocupe esas celdas: la babosa
   enuncia con su cuerpo, el viringo con los ojos. */
const ZONA_VOCAL = [];
for (const fi of [6, 7]) for (const co of [4, 5, 6]) ZONA_VOCAL.push(fi * COLS + co);

/* Perfiles: uno por ID del CRONISTA. Mismas claves que PALETA en app.js.
   ms = ritmo de mutación · elenco = cabezas de más o de menos ·
   poder = probabilidad de que entre una cabeza de poder · firma = gesto */
const PERFIL = {
  PANOPTICO:  { acc: '#55ffa6', dim: '#2b6b49', ms: 620,  elenco: 0,  poder: 0.42, firma: 'seco'   },
  LIMINAL:    { acc: '#c9a6ff', dim: '#6b4f96', ms: 1700, elenco: -1, poder: 0.00, firma: 'suave'  },
  CORRIENTE:  { acc: '#5fe0e8', dim: '#256b74', ms: 1000, elenco: 0,  poder: 0.04, firma: 'onda'   },
  ORBITAL:    { acc: '#ffc65f', dim: '#8a6520', ms: 820,  elenco: 0,  poder: 0.08, firma: 'franja' },
  POLIFONICO: { acc: '#ff7ad1', dim: '#8a3a6b', ms: 700,  elenco: 2,  poder: 0.14, firma: 'todo'   },
};
/* Rumbo = integridad del rostro.
   ritmo multiplica el intervalo (más alto = más lento) · fuera = fracción de
   celdas fuera de sitio */
const RUMBO = {
  AUTORIZADO: { elenco: -1, ritmo: 1.7,  fuera: 0.00 },
  DESPLAZADO: { elenco: 2,  ritmo: 0.55, fuera: 0.30 },
  NEUTRO:     { elenco: 0,  ritmo: 1.0,  fuera: 0.00 },
};

/* Lista de respaldo: solo se usa si el servidor no responde /clon-lista.
   Cada fila es UNA cabeza con sus nombres posibles: entra el primero que
   exista. Así un renombre (julix → jvlix, Yakuruna_cabeza → Yakuruna) ya
   no deja la cabeza afuera sin avisar. */
const RESPALDO = [
  ['jvlix.png', 'julix.png'],
  ['Babosa.png'], ['Capibara_gpt.png'], ['Cerdo.png'], ['Chiribaya_gpt.png'],
  ['Cucaracha_gemini_2.png'], ['Cuy_gemini.png'], ['Cóndor_gpt.png'], ['Dálmata_gpt.png'],
  ['El oso de anteojos_01°.png'], ['Gallina-1_gpt.png'], ['Gallinazo_gemini.png'],
  ['Gato gris_gpt.png'], ['Jaguar_gpt.png'], ['Llama_gpt.png'], ['Muy-muy_01°.png'],
  ['Viringo.png'], ['Yakuruna.png', 'Yakuruna_cabeza-1_gemini.png'],
  ['Elite_01°.png'], ['Monstruo_01°.png'], ['Monstruo_02°.png'], ['Señora K.png'],
];
const RUTA = '/clon-img/';
/* ─────────────────────────────────────────────────────────── */

const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.has('demo');
const DIAG = PARAMS.has('diag');
const SINCRO = PARAMS.get('sincro') === '1' ? true : PARAMS.get('sincro') === '0' ? false : SINCRO_BOCA;
const SINCRO_MS = Number(PARAMS.get('sincroms')) || SINCRO_EXTRA_MS;
const EMBEBIDO = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();

// El título doble: en la escena compuesta el panel ya dice CLON TRANSESPECIE.
// Este solo existe cuando el clon está solo en pantalla (Celular 2).
if (EMBEBIDO) document.getElementById('titulo').remove();

/* ── utilidades ── */
const rnd = (n) => Math.floor(Math.random() * n);
const azar = (a) => (a.length ? a[rnd(a.length)] : null);
function barajar(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sorteo(items, pesos) {
  let tot = 0; for (const p of pesos) tot += p;
  let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { r -= pesos[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const normF = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\.png$/i, '').replace(/[^a-z0-9]+/g, ' ').trim();
const MAQUETA = /^jvlix transespecie/;   // modelos, no material
function vecinos(c) {
  const x = c % COLS, y = (c - x) / COLS, v = [];
  if (x > 0) v.push(c - 1); if (x < COLS - 1) v.push(c + 1);
  if (y > 0) v.push(c - COLS); if (y < FILAS - 1) v.push(c + COLS);
  return v;
}

/* ═══ ESTADO ═══ */
const CAB = new Map();                  // archivo → { im, oc, huella, tag }
const NUCLEO = new Uint8Array(NN);      // 1 = la mitad o más de las cabezas tiene carne ahí
const FRAC_RASGO = new Float32Array(NN);// fracción de cabezas con algo en esa celda (para la silueta)
const cuenta = new Map();               // cuántas celdas tiene cada cabeza en pantalla
const revelados = new Set();            // caras de poder ya presentadas por su @CLON
const celdas = new Array(NN).fill(null);// qué cabeza ocupa cada celda (null = vacía)
const desp = new Map();                 // celdas fuera de sitio: c → { dx, dy, src }
const muda = new Set();                 // celdas vaciadas por @CLON vaciar
let elenco = [], elencoFijo = null;
let estado = 'PANOPTICO', rumbo = null, poderHabilitado = DEMO;
let figura = null, vaciado = null;
let pausa = false, pausaDesde = 0, silencioFin = 0;
let reloj = 0, proximo = 0, barajadaHasta = 0, ticks = 0, ultimaSemilla = -1, franja = 0;
let listo = false, sucio = true, ultimoAviso = '';
function avisar(t) { ultimoAviso = t; console.warn('[clon] ' + t); }

const perfil = () => PERFIL[estado] ?? PERFIL.PANOPTICO;
const integ = () => RUMBO[rumbo] ?? RUMBO.NEUTRO;
const enSilencio = () => performance.now() < silencioFin;
// Una celda está libre para el mosaico si no es parte de la muda ni de la
// figura que se está perdiendo (esas solo las suelta la propia pérdida).
const libre = (c) => !muda.has(c) && !(figura && celdas[c] === figura.f);

/* ═══ CARGA + ANÁLISIS ═══ */
const ANA = document.createElement('canvas'); ANA.width = COLS * 8; ANA.height = FILAS * 8;
const acx = ANA.getContext('2d', { willReadFrequently: true });
/* Mapa de ocupación: alfa medio de cada celda (bloques de 8×8 de una copia
   chica). Sin él, los fragmentos caen en el vacío de las esquinas. */
function analizar(im) {
  acx.clearRect(0, 0, ANA.width, ANA.height);
  acx.imageSmoothingEnabled = true; acx.imageSmoothingQuality = 'high';
  acx.drawImage(im, 0, 0, ANA.width, ANA.height);
  const d = acx.getImageData(0, 0, ANA.width, ANA.height).data;
  const oc = new Uint8Array(NN); let huella = 0, firma = '';
  for (let r = 0; r < FILAS; r++) for (let c = 0; c < COLS; c++) {
    let s = 0;
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) s += d[((r * 8 + y) * ANA.width + c * 8 + x) * 4 + 3];
    const a = Math.round(s / 64); oc[r * COLS + c] = a; if (a > CARNE) huella++;
  }
  // huella digital: descubre el mismo dibujo guardado con dos nombres
  for (let i = 0; i < d.length; i += 4 * 61) firma += (d[i] >> 4).toString(16) + (d[i + 3] >> 4).toString(16);
  return { oc, huella, firma };
}
function etiqueta(f) {
  const n = normF(f);
  if (n.startsWith('jvlix') || n.startsWith('julix')) return 'humano';
  if (SOLO_EN_SU_CLON.some((p) => n.startsWith(p))) return 'reservada';
  if (Object.values(SEQUITO).flat().some((p) => n.startsWith(p))) return 'reservada';
  if (PODER.some((p) => n.startsWith(p))) return 'poder';
  return 'especie';
}
function cargarImagen(nombre) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = RUTA + encodeURIComponent(nombre);
  });
}
async function cargarGrupo(nombres) {
  for (const n of nombres) { const im = await cargarImagen(n); if (im) return { f: n, im }; }
  avisar('no cargó: ' + nombres.join(' | '));
  return null;
}
async function listaDeImagenes() {
  // El servidor nuevo lista la carpeta: una imagen nueva o renombrada entra sola.
  try {
    const r = await fetch('/clon-lista', { cache: 'no-store' });
    if (r.ok) {
      const lista = await r.json();
      if (Array.isArray(lista) && lista.length) {
        return lista.filter((n) => /\.png$/i.test(n) && !MAQUETA.test(normF(n)))
          .sort((a, b) => a.length - b.length || a.localeCompare(b)).map((n) => [n]);
      }
    }
  } catch (_) { /* servidor viejo: respaldo */ }
  return RESPALDO;
}
async function cargarTodo() {
  const grupos = await listaDeImagenes();
  const cargadas = await Promise.all(grupos.map(cargarGrupo));
  const vistas = new Map();
  for (const x of cargadas) {
    if (!x) continue;
    const a = analizar(x.im);
    if (vistas.has(a.firma)) { console.info('[clon] duplicado, se omite:', x.f, '=', vistas.get(a.firma)); continue; }
    vistas.set(a.firma, x.f);
    CAB.set(x.f, { im: x.im, oc: a.oc, huella: a.huella, tag: etiqueta(x.f) });
  }
  const n = CAB.size || 1;
  const comunes = [...CAB.values()].filter((v) => v.tag === 'especie' || v.tag === 'humano');
  for (let c = 0; c < NN; c++) {
    let k = 0; for (const v of CAB.values()) if (v.oc[c] > CARNE) k++;
    NUCLEO[c] = k / n >= 0.5 ? 1 : 0;
    let r = 0; for (const v of comunes) if (v.oc[c] > RASGO) r++;
    FRAC_RASGO[c] = comunes.length ? r / comunes.length : 1;
  }
}
function buscar(q) {
  const lista = [...CAB.keys()];
  return lista.find((f) => normF(f) === q) ?? lista.find((f) => normF(f).startsWith(q))
      ?? lista.find((f) => normF(f).includes(q)) ?? null;
}

/* ═══ ELENCO: las cabezas activas ═══ */
function permitida(f) {
  const t = CAB.get(f)?.tag;
  if (!t) return false;
  if (figura && f === figura.f) return false;   // la figura no se infiltra en su propia pérdida
  if (figura?.sequito?.includes(f)) return figura.fase === 'pierde' || figura.fase === 'resto';
  if (elencoFijo) return elencoFijo.includes(f);
  if (vaciado) return t === 'especie';
  if (t === 'reservada') return false;
  if (t === 'poder') return poderHabilitado && perfil().poder > 0 && (!PODER_TRAS_SU_CLON || revelados.has(f));
  return true;
}
function poolGeneral() {
  const vivas = [...CAB.keys()].filter(permitida);
  if (vaciado) return vivas;
  if (Math.random() < perfil().poder) {
    const pod = vivas.filter((f) => CAB.get(f).tag === 'poder');
    if (pod.length) return pod;
  }
  return vivas.filter((f) => CAB.get(f).tag !== 'poder');
}
function pesoElenco(f) {
  const k = CAB.get(f);
  if (k.tag === 'humano') return PESO_JVLIX;
  return k.huella > 95 ? PESO_GRANDE : 1;
}
function tamElenco() {
  return Math.max(4, Math.min(12, ELENCO_BASE + perfil().elenco + integ().elenco));
}
function sumarAlElenco() {
  const pool = (elencoFijo ?? poolGeneral()).filter((f) => !elenco.includes(f));
  if (!pool.length) return false;
  elenco.push(sorteo(pool, pool.map(pesoElenco)));
  return true;
}
function ajustarElenco() {
  elenco = elenco.filter(permitida);
  const k = tamElenco();
  while (elenco.length > k) elenco.splice(rnd(elenco.length), 1);
  for (let i = 0; i < 12 && elenco.length < k; i++) if (!sumarAlElenco()) break;
}
function rotarElenco() {
  if (elenco.length > 1) elenco.splice(rnd(elenco.length), 1);
  sumarAlElenco();
}

/* ═══ CELDAS ═══ */
function poner(c, f) {
  if (f && muda.has(c)) return;
  const antes = celdas[c];
  if (antes !== f) {
    if (antes) cuenta.set(antes, (cuenta.get(antes) || 1) - 1);
    if (f) cuenta.set(f, (cuenta.get(f) || 0) + 1);

  }

}
let llenasAhora = 0;
function contarLlenas() { let k = 0; for (let c = 0; c < NN; c++) if (celdas[c]) k++; return k; }
/* Quién puede ocupar la celda c.
   · Solo cabezas con algo ahí: carne en el núcleo; en la periferia basta un
     rasgo (antena, oreja, aleta) y ganan los rasgos finos, para que la
     silueta no la dicte el pelaje de las cabezas grandes.
   · BALANCE: gana la cabeza que MENOS celdas tiene en pantalla (peso 1/(1+n)²),
     y ninguna pasa del tope. Así no hay animal base: ninguna cabeza manda. */
function candidato(c, lista = elenco, excluir = null) {
  const nucleo = NUCLEO[c] === 1;
  let cand = lista.filter((f) => f !== excluir && CAB.get(f).oc[c] > (nucleo ? CARNE : RASGO));
  if (!cand.length && nucleo) cand = lista.filter((f) => f !== excluir && CAB.get(f).oc[c] > RASGO);
  if (!cand.length) return null;
  const tope = Math.max(5, Math.ceil(TOPE_CABEZA * Math.max(llenasAhora, 60) / Math.max(1, lista.length)));
  let bajoTope = cand.filter((f) => (cuenta.get(f) || 0) < tope);
  if (!bajoTope.length) {
    if (!nucleo) return null;            // en el núcleo nunca un hueco: la que menos tiene
    let min = Infinity; for (const f of cand) min = Math.min(min, cuenta.get(f) || 0);
    bajoTope = cand.filter((f) => (cuenta.get(f) || 0) === min);
  }
  return sorteo(bajoTope, bajoTope.map((f) =>
    (nucleo ? 1 : 1 / Math.max(8, CAB.get(f).huella)) / Math.pow(1 + (cuenta.get(f) || 0), 2)
    / Math.pow(1 + iguales(c, f), SEPARA)));
}
// Cuántas vecinas de c ya son de f: una cabeza no se pega a sí misma, así
// los órganos (un parche de 1 a 3 celdas) no se juntan en una región.
function iguales(c, f) { let k = 0; for (const v of vecinos(c)) if (celdas[v] === f) k++; return k; }
/* Llenar una celda como lo haría el mosaico: en la periferia, solo a veces
   (más seguido donde más cabezas tienen algo): la silueta queda irregular. */
function llenar(c, tam = tamParche()) {
  if (!libre(c)) return;
  if (!NUCLEO[c] && Math.random() > 0.2 + 0.8 * FRAC_RASGO[c]) { poner(c, null); return; }
  const f = candidato(c);
  if (f) parche(c, f, tam); else poner(c, null);
}
/* Un parche: la celda c y hasta tam-1 vecinas donde f tenga algo, en UN corte. */
function parche(c, f, tam, puede = libre) {
  const hechas = [c]; poner(c, f);
  const frontera = vecinos(c);
  while (hechas.length < tam && frontera.length) {
    const v = frontera.splice(rnd(frontera.length), 1)[0];
    if (hechas.includes(v) || !puede(v)) continue;
    if (CAB.get(f).oc[v] <= (NUCLEO[v] ? CARNE : RASGO)) continue;
    poner(v, f); hechas.push(v); frontera.push(...vecinos(v));
  }
  return hechas;
}
function componerDeCero() {
  for (const c of barajar([...Array(NN).keys()])) {
    if (celdas[c] || !libre(c)) continue;
    llenasAhora = contarLlenas();
    llenar(c);
  }
}

/* ═══ MUTACIÓN NORMAL (sin figura) ═══ */
function semillas(firma) {
  const cuantas = { seco: 2 + rnd(2), suave: 1, onda: 1 + rnd(2), franja: 2 + rnd(2), todo: 3 + rnd(2) }[firma] ?? 2;
  const out = [];
  for (let i = 0; i < cuantas; i++) {
    let c;
    if (firma === 'onda' && ultimaSemilla >= 0) {        // CORRIENTE: baja por la cara
      const x = Math.min(COLS - 1, Math.max(0, (ultimaSemilla % COLS) + rnd(3) - 1));
      const y = Math.floor(ultimaSemilla / COLS) + 1;
      c = y < FILAS ? y * COLS + x : rnd(COLS);
    } else if (firma === 'franja') {                     // ORBITAL: barrido por filas
      c = franja * COLS + rnd(COLS);
      if (Math.random() < 0.4) franja = (franja + 1) % FILAS;
    } else c = rnd(NN);
    ultimaSemilla = c; out.push(c);
  }
  return out;
}
// Casi siempre una celda sola: fragmentos sueltos, no regiones de un animal.
function tamParche() { const r = Math.random(); return r < 0.6 ? 1 : r < 0.9 ? 2 : 3; }
function desarmarCelda(c) {
  const v = vecinos(c);
  desp.set(c, { dx: (Math.random() * 2 - 1) * 0.42, dy: (Math.random() * 2 - 1) * 0.42,
                src: Math.random() < 0.3 ? azar(v) : c });
  sucio = true;
}
/* El rumbo sobre el rostro: DESPLAZADO saca celdas de sitio (y algunas
   muestran el pedazo de la celda vecina: un ojo donde iba la mejilla);
   AUTORIZADO las devuelve a su lugar. Siempre por cortes. */
function integridad() {
  for (const c of [...desp.keys()]) if (!celdas[c]) desp.delete(c);
  const llenas = []; for (let c = 0; c < NN; c++) if (celdas[c]) llenas.push(c);
  const meta = Math.round(llenas.length * integ().fuera);
  if (desp.size < meta) {
    const sentadas = llenas.filter((c) => !desp.has(c));
    for (let k = 0; k < 3 && desp.size < meta && sentadas.length; k++) desarmarCelda(sentadas.splice(rnd(sentadas.length), 1)[0]);
  } else if (desp.size > meta) {
    const fuera = [...desp.keys()];
    for (let k = 0; k < 4 && desp.size > meta; k++) { desp.delete(fuera.splice(rnd(fuera.length), 1)[0]); sucio = true; }
  }
  if (meta > 0) for (let k = 0; k < 2 && desp.size; k++) desarmarCelda(azar([...desp.keys()]));   // tiemblan, por cortes
}
/* @SILENCIO: nadie habla y el rostro se descompone muy despacio. */
function descomponer() {
  const llenas = []; for (let c = 0; c < NN; c++) if (celdas[c] && libre(c)) llenas.push(c);
  const c = azar(llenas); if (c == null) return;
  if (Math.random() < 0.6) poner(c, null);
  else { const f = candidato(c); if (f) poner(c, f); }
}
function tick() {
  if (enSilencio()) { descomponer(); return; }
  ajustarElenco();
  llenasAhora = contarLlenas();
  ticks++;
  if (barajadaHasta > reloj || ticks % 5 === 0) rotarElenco();
  // Primero lo pendiente: celdas de cabezas que salieron del elenco (huérfanas)
  // y huecos del NÚCLEO que ya tienen quién los llene. La periferia no se
  // exige: respira. Las huérfanas son deuda de una cabeza que ya se fue y se
  // pagan en unos 3 ticks, por muchas que sean: lo que deja una figura (los
  // Monstruos de la Señora K) no se queda de base mientras el mosaico vuelve.
  const huerfanas = [], huecos = [];
  for (let c = 0; c < NN; c++) {
    if (!libre(c)) continue;
    const f = celdas[c];
    if (f) { if (!elenco.includes(f)) huerfanas.push(c); }
    else if (NUCLEO[c] && candidato(c)) huecos.push(c);
  }
  const cupo = Math.max(4, Math.ceil(huerfanas.length / 3));
  for (const c of barajar(huerfanas).concat(barajar(huecos)).slice(0, cupo)) llenar(c);
  for (const c of semillas(perfil().firma)) llenar(c);

}
function intervalo() {
  if (barajadaHasta > reloj) return 140;
  return perfil().ms * integ().ritmo * (hablando ? 0.6 : 1) * (0.7 + Math.random() * 0.6);
}

/* ═══ @CLON: ensamble → sostén → pérdida ═══ */
function forzarFigura(nombre, segundos, extra = {}) {
  const q = normF(nombre);
  if (!q || !listo) return;
  if (q === 'vaciar') return iniciarVaciado(segundos);
  const f = buscar(q) ?? (q === 'jvlix' ? buscar('julix') : q === 'julix' ? buscar('jvlix') : null);
  if (!f) { avisar(`@CLON ${nombre}: no encuentro esa imagen`); return; }
  restaurar();
  revelados.add(f);                      // desde ahora, si es de poder, puede infiltrarse
  const clave = normF(f);
  const dueno = Object.keys(SEQUITO).find((k) => clave.startsWith(k));
  const sequito = dueno ? [...CAB.keys()].filter((g) => SEQUITO[dueno].some((p) => normF(g).startsWith(p))) : null;
  const objetivo = [];
  for (let c = 0; c < NN; c++) objetivo[c] = CAB.get(f).oc[c] > RASGO ? f : null;
  const orden = barajar([...Array(NN).keys()].filter((c) => celdas[c] !== objetivo[c] || desp.has(c)));
  const sostenMs = (Number(segundos) > 0 ? Number(segundos) : SOSTEN_S) * 1000;
  // "@CLON figura s fin": el orquestador manda cuánto le falta al agente
  // (hasta) y cuánto de eso es silencio. La pérdida se estira para terminar
  // justo cuando el agente cierra. El silencio cuenta a un cuarto, porque en
  // silencio el tiempo del rostro corre a un cuarto.
  let perdidaMs = PERDIDA_S * 1000, hastaFin = false;
  const hasta = Number(extra?.hasta);
  if (hasta > 0) {
    const sil = Math.max(0, Math.min(hasta, Number(extra?.silencio) || 0));
    const presupuesto = ((hasta - sil) + sil * RITMO_SILENCIO) * 1000;
    perdidaMs = Math.max(PERDIDA_MIN_S * 1000, presupuesto - ENSAMBLE_S * 1000 - sostenMs);
    hastaFin = true;
  }
  figura = { f, sequito, fase: 'ensambla', t: 0, objetivo, orden, hechas: 0, sostenMs, perdidaMs, hastaFin };
  sucio = true;
}
function empezarPerdida(F) {
  F.fase = 'pierde'; F.t = 0; F.relleno = 0;
  F.restan = barajar([...Array(NN).keys()].filter((c) => celdas[c] === F.f));
  F.total = F.restan.length;
  elencoFijo = F.sequito && F.sequito.length && SEQUITO_SOLO ? F.sequito : null;
  elenco = elenco.filter((g) => g !== F.f);

}
/* Un agente nuevo nunca hereda la figura del anterior: lo que quede se

function cierreRapido() {
  const F = figura; if (!F) return;
  if (F.fase !== 'pierde') empezarPerdida(F);
  else {
    F.restan = barajar([...Array(NN).keys()].filter((c) => celdas[c] === F.f));
    F.total = F.restan.length; F.t = 0;
  }

}
function avanzarFigura(dt) {
  const F = figura; F.t += dt;
  if (F.fase === 'ensambla') {           // aparece con fragmentos hasta verse sola
    const meta = Math.ceil(Math.min(1, F.t / (ENSAMBLE_S * 1000)) * F.orden.length);
    while (F.hechas < meta) {
      const c = F.orden[F.hechas++];
      if (desp.delete(c)) sucio = true;
      if (F.objetivo[c]) { muda.delete(c); poner(c, F.objetivo[c]); } else poner(c, null);
    }
    if (F.t >= ENSAMBLE_S * 1000) { F.fase = 'sostiene'; F.t = 0; }
    return;
  }
  if (F.fase === 'sostiene') {           // la cabeza sola, el tiempo escrito
    if (F.t < F.sostenMs) return;
    empezarPerdida(F);
    return;
  }
  if (F.fase === 'resto') {              // "fin": unos fragmentos sueltos, vivos, hasta que cierra el agente
    F.mueve = (F.mueve || 0) + dt;
    if (F.mueve >= RESTO_MUEVE_S * 1000) { F.mueve = 0; moverResto(F); }
    return;                              // lo termina el cierre rápido, cuando llega el agente siguiente
  }
  // pierde: otras cabezas se le superponen al azar, continuamente
  llenasAhora = contarLlenas();
  const prog = Math.min(1, F.t / F.perdidaMs);
  // Con "fin" la pérdida no baja de un resto: si el agente se alarga (modo
  // manual, velocidad más lenta) la figura sigue ahí, en fragmentos, hasta
  // que de verdad entra el siguiente. Si se acorta, el cierre rápido la corta.
  const piso = F.hastaFin && !F.rapido ? Math.ceil(F.total * RESTO_FIN) : 0;
  const quedan = Math.max(piso, Math.ceil(F.total * (1 - prog)));
  // Con séquito (Señora K → Monstruos) la silueta de la figura se conserva y
  // se rellena de otras caras: los Monstruos son collages a sangre y, si
  // pudieran crecer al vacío, terminarían en un cuadrado. Sin séquito, la
  // pérdida también se come el vacío de alrededor (vuelven orejas, antenas).
  const comer = elencoFijo ? (v) => celdas[v] === F.f : (v) => celdas[v] === F.f || !celdas[v];
  while ((cuenta.get(F.f) || 0) > quedan && F.restan.length) {   // cuenta lo que de verdad queda en pantalla
    const c = F.restan.pop();
    if (celdas[c] !== F.f) continue;
    const g = candidato(c, elenco, F.f);
    if (g) parche(c, g, 1 + rnd(3), comer); else poner(c, null);
  }
  if (!enSilencio() && !elencoFijo) F.relleno += dt;   // vuelven orejas, antenas, aletas (no en silencio ni con séquito)
  if (F.relleno > 420) {
    F.relleno = 0;
    const vacias = []; for (let c = 0; c < NN; c++) if (!celdas[c] && libre(c)) vacias.push(c);
    const c = azar(vacias);
    if (c != null) { const g = candidato(c, elenco, F.f); if (g) parche(c, g, 1 + rnd(2), (v) => !celdas[v]); }
  }
  if (prog >= 1) {
    if (piso > 0) { F.fase = 'resto'; F.t = 0; F.mueve = 0; return; }
    for (const c of F.restan) if (celdas[c] === F.f) poner(c, candidato(c, elenco, F.f));
    const conSequito = !!elencoFijo;
    figura = null; elencoFijo = null;    // las reservadas se van: quedan huérfanas y se reemplazan primero
    proximo = reloj;
    // Cambio de agente, o fin de un séquito (los Monstruos): el mosaico se
    // baraja en 1,4 s y las reservadas se van por cortes, sin quedarse de base.
    if (F.rapido || conSequito) barajadaHasta = reloj + 1400;
  }
}

/* El resto de una figura "fin" no se queda pegado: un fragmento suyo se
   va (lo reemplaza otra cabeza) y aparece otro donde ella tiene carne. */
function moverResto(F) {
  const suyas = [], sitios = [];
  for (let c = 0; c < NN; c++) {
    if (celdas[c] === F.f) suyas.push(c);
    else if (!muda.has(c) && CAB.get(F.f).oc[c] > CARNE) sitios.push(c);
  }
  const sale = azar(suyas), entra = azar(sitios);
  if (sale == null || entra == null) return;
  poner(sale, candidato(sale, elenco, F.f));
  if (desp.delete(entra)) sucio = true;
  poner(entra, F.f);
}

/* ═══ @CLON vaciar: la muda ═══ */
function iniciarVaciado(segundos) {
  figura = null; elencoFijo = null;
  rumbo = null;                          // la muda queda quieta, en su sitio: un resto, no un temblor
  const yo = buscar('jvlix') ?? buscar('julix');
  vaciado = { fase: 'retrato', t: 0, yo, hechas: 0,
              ms: Math.max(8, Number(segundos) > 0 ? Number(segundos) : VACIAR_S) * 1000 };
  ajustarElenco();                       // desde ahora: solo especies
  const plan = [];
  for (let c = 0; c < NN; c++) {
    if (yo && CAB.get(yo).oc[c] > CARNE) { if (celdas[c] !== yo || desp.has(c)) plan.push([c, yo]); }
    else if (celdas[c] && CAB.get(celdas[c]).tag !== 'especie') plan.push([c, null]);
  }
  vaciado.plan = barajar(plan);
  sucio = true;
}
function avanzarVaciado(dt) {
  const V = vaciado; V.t += dt;
  llenasAhora = contarLlenas();
  if (V.fase === 'retrato') {            // tu cara, entre especies
    const meta = Math.ceil(Math.min(1, V.t / (ENSAMBLE_S * 1000)) * V.plan.length);
    while (V.hechas < meta) {
      const [c, f] = V.plan[V.hechas++];
      if (desp.delete(c)) sucio = true;
      poner(c, f ?? candidato(c));
    }
    if (V.t >= ENSAMBLE_S * 1000) { V.fase = 'sostiene'; V.t = 0; }
  } else if (V.fase === 'sostiene') {
    if (V.t < RETRATO_S * 1000) return;
    V.fase = 'vacia'; V.t = 0;
    V.restan = barajar([...Array(NN).keys()].filter((c) => celdas[c] && CAB.get(celdas[c]).tag !== 'especie'));
    V.total = V.restan.length;
  } else if (V.fase === 'vacia') {       // se vacía celda a celda
    const prog = Math.min(1, V.t / V.ms);
    const quedan = Math.ceil(V.total * (1 - prog));
    while (V.restan.length > quedan) { const c = V.restan.pop(); poner(c, null); muda.add(c); }
    if (prog >= 1) { V.fase = 'hecho'; proximo = reloj; }
  }
}
/* Un rostro nuevo (o un preludio nuevo) re-habita el clon vaciado. */
function restaurar() {
  if (!vaciado && !muda.size) return;
  vaciado = null; muda.clear(); ajustarElenco(); sucio = true;
}

/* ═══ LIENZO ═══ */
const cv = document.getElementById('lienzo'), cx = cv.getContext('2d');
let W = 0, H = 0, lado = 0, ox = 0, oy = 0, celW = 0, celH = 0;
function redim() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lado = Math.min(W, H) * 0.97; ox = (W - lado) / 2; oy = (H - lado) / 2;
  celW = lado / COLS; celH = lado / FILAS;
  sucio = true;
}
addEventListener('resize', redim);
function pinta(f, src, dst, dx, dy, latido) {
  const sw = SRC / COLS, sh = SRC / FILAS;
  const sc = src % COLS, sr = (src - sc) / COLS, dc = dst % COLS, dr = (dst - dc) / COLS;
  let y = oy + (dr + dy) * celH, h = celH;
  if (latido > 0) { const k = 1 + latido * 0.30; y -= h * (k - 1) / 2; h *= k; }
  cx.drawImage(CAB.get(f).im, sc * sw, sr * sh, sw, sh, ox + (dc + dx) * celW, y, celW + 0.6, h + 0.6);
}
function dibujar() {
  sucio = false;
  cx.clearRect(0, 0, W, H);
  for (let c = 0; c < NN; c++) { const f = celdas[c]; if (f && !desp.has(c)) pinta(f, c, c, 0, 0, 0); }
  for (const [c, d] of desp) { const f = celdas[c]; if (f) pinta(f, d.src, c, d.dx, d.dy, 0); }
  if (amp > 0.02) for (const c of ZONA_VOCAL) { const f = celdas[c]; if (f && !desp.has(c)) pinta(f, c, c, 0, 0, amp); }
  cx.strokeStyle = perfil().dim; cx.globalAlpha = 0.2; cx.lineWidth = 1;
  cx.beginPath();
  for (let c = 1; c < COLS; c++) { cx.moveTo(ox + c * celW, oy); cx.lineTo(ox + c * celW, oy + lado); }
  for (let f = 1; f < FILAS; f++) { cx.moveTo(ox, oy + f * celH); cx.lineTo(ox + lado, oy + f * celH); }
  cx.stroke(); cx.globalAlpha = 1;
}

/* ═══ VOZ: se analiza en silencio; el sonido sale por la página principal ═══ */
let actx = null, analiz = null, datos = null, voz = null, nodoVoz = null;
let hablando = false, fuenteReal = false, finHabla = 0, amp = 0, velocidadVoz = 1;
const retrasos = [];                     // llegada del evento → la copia suena (ms)
function abrirAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analiz = actx.createAnalyser(); analiz.fftSize = 256;
    datos = new Uint8Array(analiz.frequencyBinCount);
  } catch (e) { console.warn('[clon] sin WebAudio'); }
}
// Con --autoplay-policy=no-user-gesture-required (el comando de la TV) el
// analizador arranca solo, sin que nadie toque el iframe.
abrirAudio();
setTimeout(() => { try { if (actx && actx.state === 'suspended') actx.resume(); } catch (_) {} }, 600);
// Cualquier toque, clic o tecla despierta el audio (no solo el primero: si
// Android lo vuelve a suspender, el siguiente toque lo reanuda).
const despertarAudio = () => { abrirAudio(); try { if (actx && actx.state !== 'running') actx.resume(); } catch (_) {} };
for (const tipo of ['pointerdown', 'touchstart', 'click', 'keydown']) addEventListener(tipo, despertarAudio, { passive: true });

/* hablar: SOLO si el bloque trae audio. Un bloque sin voz no mueve la boca. */
function hablar(texto, archivo, sonido) {
  // @SONIDO (la rana, el Kuak) pasa por el mismo analizador: el clon croa.
  const url = sonido ? '/sonido/' + encodeURIComponent(sonido) : archivo ? '/audio/' + archivo : null;
  if (!url) return;
  silencioFin = 0;
  hablando = true; fuenteReal = false;
  const llegada = performance.now();
  finHabla = llegada + Math.max(2500, (texto?.length ?? 40) * 72) / velocidadVoz;
  if (!actx) return;                     // sin WebAudio: sílabas por duración
  try {
    if (voz) { try { voz.pause(); } catch (_) {} }
    // Una sola fuente conectada: la anterior se desconecta.
    if (nodoVoz) { try { nodoVoz.disconnect(); } catch (_) {} nodoVoz = null; }
    const a = new Audio();
    a.crossOrigin = 'anonymous'; a.preload = 'auto'; a.src = url;
    voz = a;
    nodoVoz = actx.createMediaElementSource(a);
    nodoVoz.connect(analiz);             // NO a destination: es mudo
    a.playbackRate = velocidadVoz;
    a.addEventListener('loadedmetadata', () => {
      if (voz === a && isFinite(a.duration)) finHabla = performance.now() + a.duration * 1000 / a.playbackRate + 300;
    });
    a.addEventListener('playing', () => {
      if (voz !== a) return;
      retrasos.push(Math.round(performance.now() - llegada)); if (retrasos.length > 6) retrasos.shift();
    }, { once: true });
    const arrancar = () => {
      if (voz !== a || pausa || enSilencio()) return;
      if (SINCRO) {                      // salta hasta donde ya va la voz real
        const adelanto = (performance.now() - llegada + SINCRO_MS) / 1000 * a.playbackRate;
        if (adelanto > 0.04 && isFinite(a.duration) && adelanto < a.duration) a.currentTime = adelanto;
      }
      a.play().then(() => { if (voz === a) fuenteReal = true; }).catch(() => { if (voz === a) fuenteReal = false; });
    };
    if (SINCRO) a.addEventListener('canplay', arrancar, { once: true }); else arrancar();
  } catch (e) { fuenteReal = false; }
}
function callar(segundos) {             // @SILENCIO: boca cerrada en el acto
  silencioFin = performance.now() + Math.max(0.5, Number(segundos) || 5) * 1000;
  hablando = false; fuenteReal = false;
  if (voz) { try { voz.pause(); } catch (_) {} }
  sucio = true;
}
function fijarPausa(activa) {
  if (activa === pausa) return;
  const ahora = performance.now();
  if (activa) { pausaDesde = ahora; if (voz) { try { voz.pause(); } catch (_) {} } }
  else {
    const d = ahora - pausaDesde;
    if (silencioFin) silencioFin += d;
    finHabla += d;
    if (voz && hablando && !voz.ended) voz.play().catch(() => {});
  }
  pausa = activa;
}
function hablarSimulado(ms) {            // solo para el demo
  if (enSilencio() || pausa) return;
  hablando = true; fuenteReal = false; finHabla = performance.now() + ms;
}

/* ═══ PERFIL Y RUMBO ═══ */
function aplicarEstado(n) {
  if (!PERFIL[n]) return;
  const cambio = n !== estado;
  estado = n;
  document.documentElement.style.setProperty('--accent', PERFIL[n].acc);
  document.documentElement.style.setProperty('--accent-dim', PERFIL[n].dim);
  if (cambio && !figura && !vaciado) { barajadaHasta = reloj + 1600; proximo = reloj; }
  sucio = true;
}
function fijarRumbo(e) {
  const nuevo = e === 'AUTORIZADO' || e === 'DESPLAZADO' ? e : null;
  if (nuevo === rumbo) return;
  rumbo = nuevo;
  if (!figura && !vaciado) { barajadaHasta = Math.max(barajadaHasta, reloj + 900); proximo = reloj; }
}

/* ═══ BUCLE ═══ */
let ultimoCuadro = performance.now(), bocaAbierta = false;
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  const dt = Math.min(60000, Math.max(0, ahora - ultimoCuadro)); ultimoCuadro = ahora;
  if (!listo) return;
  // Pausa: todo quieto. Silencio: el tiempo del rostro corre a un cuarto.
  const velo = pausa ? 0 : enSilencio() ? RITMO_SILENCIO : 1;
  const dtE = dt * velo;
  reloj += dtE;
  if (figura) avanzarFigura(dtE);
  else if (vaciado && vaciado.fase !== 'hecho') avanzarVaciado(dtE);
  // El mosaico sigue vivo alrededor de una figura que se pierde (no en su
  // ensamble ni en su sostén, ni con séquito: ahí manda la figura).
  const vivo = figura ? (figura.fase === 'pierde' || figura.fase === 'resto') && !elencoFijo
                      : !(vaciado && vaciado.fase !== 'hecho');
  if (vivo && !pausa && reloj >= proximo) { tick(); proximo = reloj + intervalo(); }

  // Análisis real solo si el contexto de audio corre: suspendido (un celular
  // que nadie tocó), el analizador lee ceros y la boca quedaría muerta.
  const real = fuenteReal && actx && actx.state === 'running';
  if (hablando && !pausa) {
    if ((real && voz && voz.ended) || ahora > finHabla + (real ? 1500 : 0)) hablando = false;
  }
  if (hablando && !pausa) {
    let a;
    if (real && analiz) {
      analiz.getByteFrequencyData(datos);
      let s = 0; for (let i = 2; i < 40; i++) s += datos[i];
      a = Math.min(1, s / 38 / 105);
    } else a = 0.30 + 0.70 * Math.abs(Math.sin(ahora / 88) + 0.5 * Math.sin(ahora / 53)) / 1.5;
    amp = Math.max(a, amp * 0.8);
  } else if (!pausa) amp = amp * 0.7 < 0.02 ? 0 : amp * 0.7;
  const boca = amp > 0.02;
  if (sucio || boca || boca !== bocaAbierta) dibujar();
  bocaAbierta = boca;
}

/* ═══ WEBSOCKET: los mismos eventos que ya emite el orquestador ═══ */
// Antes de la función (y en reposo tras un ensayo) el clon muestra solo
// especies y tu rostro. Las caras de poder se habilitan con actividad real de
// la obra, no con el estado que el servidor reenvía al conectarse.
const ACTIVIDAD = new Set(['segmento', 'preludio', 'agente_id', 'clon', 'silencio']);
function alEvento(m) {
  const d = m.datos ?? {};
  if (ACTIVIDAD.has(m.tipo)) poderHabilitado = true;
  switch (m.tipo) {
    // afecto = entra un agente (o el preludio, o el cierre): la figura del
    // agente anterior no se hereda.
    case 'afecto':    if (figura) cierreRapido(); aplicarEstado(d.estado); break;
    case 'rumbo':     fijarRumbo(d.estado); break;
    case 'segmento':  hablar(d.texto, d.audio, d.sonido); break;
    // El preludio va antes de todo agente: rostro neutro, aunque el servidor
    // recuerde el rumbo del ensayo anterior.
    // Una función nueva: las caras de poder vuelven a estar sin presentar.
    case 'preludio':  revelados.clear(); restaurar(); fijarRumbo(null); hablar(d.texto, d.audio); break;
    case 'agente_id': hablar(d.texto, d.audio); break;   // ya no cambia el rostro: eso lo dice @CLON
    case 'clon':      forzarFigura(d.figura, d.segundos, d); break;
    case 'silencio':  callar(d.segundos); break;
    case 'pausa':     fijarPausa(!!d.activa); break;
    case 'velocidad':
      velocidadVoz = Math.min(2, Math.max(0.5, Number(d.valor) || 1));
      if (voz) voz.playbackRate = velocidadVoz;
      break;
  }
}
function conectar() {
  let ws; try { ws = new WebSocket(`ws://${location.host}`); } catch (e) { return; }
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (_) {} }
    alEvento(m);
  };
  ws.onclose = () => setTimeout(conectar, 2000);
}

/* ═══ DIAGNÓSTICO (?diag=1) ═══ */
function diagnostico() {
  const nombre = (f) => normF(f).replace(/ (gpt|gemini|cabeza).*$/, '');
  const F = figura, V = vaciado;
  const lineas = [
    `perfil ${estado} · rumbo ${rumbo ?? '—'} · fuera de sitio ${desp.size}`,
    `elenco (${elenco.length}): ${elenco.map(nombre).join(', ')}${elencoFijo ? '  [séquito]' : ''}`,
    (() => { const ll = contarLlenas() || 1; let mx = 0, quien = '';
             for (const [f, n] of cuenta) if (n > mx) { mx = n; quien = f; }
             return `cabeza con más celdas: ${quien ? nombre(quien) : '—'} ${Math.round(100 * mx / ll)} % · ${ll} celdas llenas`; })(),
    F ? `figura ${nombre(F.f)} · ${F.fase} ${(F.t / 1000).toFixed(1)} s` +
        (F.fase === 'sostiene' ? ` / ${F.sostenMs / 1000}` : F.fase === 'pierde' ? ` / ${(F.perdidaMs / 1000).toFixed(1)}` : '') +
        (F.fase === 'resto' ? ` · quedan ${cuenta.get(F.f) || 0} fragmentos hasta que cierre el agente`
          : F.hastaFin ? ' · hasta el cierre del agente' : '') + (F.rapido ? ' · cierre rápido' : '') +
        (F.sequito ? ` · séquito ${F.sequito.map(nombre).join(', ')}` : '')
      : V ? `vaciar · ${V.fase} ${(V.t / 1000).toFixed(1)} s · vaciadas ${muda.size}` : 'figura —',
    `silencio ${enSilencio() ? ((silencioFin - performance.now()) / 1000).toFixed(1) + ' s' : 'no'} · pausa ${pausa ? 'SÍ' : 'no'}`,
    `voz ${hablando ? 'hablando' : 'callada'} · ${fuenteReal ? 'análisis real' : 'sílabas por duración'} · audio ${actx ? actx.state : 'sin WebAudio'}`,
    `retraso de la copia (llegada → suena): ${retrasos.length ? retrasos.join(' · ') + ' ms' : '—'}`,
    `sincro ${SINCRO ? 'ON' + (SINCRO_MS ? ' +' + SINCRO_MS + ' ms' : '') : 'OFF'} · ${CAB.size} cabezas · ${EMBEBIDO ? 'en escena' : 'solo'}`,
  ];
  if (ultimoAviso) lineas.push('⚠ ' + ultimoAviso);
  document.getElementById('diag').textContent = lineas.join('\n');
}

/* ═══ DEMO (?demo=1): la obra entera en ~2 min, con sostenes cortos ═══
   Teclas: 1-5 perfil · A autorizado · D desplazado · N sin rumbo ·
   S silencio · J jvlix · E Elite · K Señora K · Y Yakuruna · V vaciar ·
   P pausa · H voz · R re-habitar. Una tecla pasa el demo a modo manual. */
let manual = false;
function rotulo(t) { const r = document.getElementById('rotulo'); r.style.display = 'block'; r.textContent = t; }
async function demo() {
  const esp = (ms) => new Promise((r) => setTimeout(r, ms));
  const paso = async (txt, fn, ms) => { if (manual) return; rotulo(txt); fn(); await esp(ms); };
  setInterval(() => { if (!manual && Math.random() < 0.8) hablarSimulado(2500 + Math.random() * 2500); }, 6500);
  while (!manual) {
    await paso('preludio · @CLON jvlix', () => { aplicarEstado('LIMINAL'); fijarRumbo(null); forzarFigura('jvlix', 6); }, 16000);
    await paso('Donald-Prompt · desplazado', () => { aplicarEstado('PANOPTICO'); fijarRumbo('DESPLAZADO'); }, 9000);
    await paso('@CLON Elite', () => forzarFigura('Elite', 6), 18000);
    await paso('@SILENCIO 6', () => callar(6), 7000);
    await paso('Eco-Satelital · autorizado', () => { aplicarEstado('ORBITAL'); fijarRumbo('AUTORIZADO'); }, 9000);
    await paso('@CLON Yakuruna', () => forzarFigura('Yakuruna', 6), 18000);
    await paso('Quimera · desplazado', () => { aplicarEstado('POLIFONICO'); fijarRumbo('DESPLAZADO'); }, 8000);
    await paso('@CLON Señora K → monstruos', () => forzarFigura('Señora K', 6), 26000);
    await paso('cierre · @CLON vaciar', () => { aplicarEstado('LIMINAL'); fijarRumbo(null); forzarFigura('vaciar', 12); }, 26000);
  }
}
if (DEMO) addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase(), ids = Object.keys(PERFIL);
  const acc = {
    a: () => fijarRumbo('AUTORIZADO'), d: () => fijarRumbo('DESPLAZADO'), n: () => fijarRumbo(null),
    s: () => callar(6), j: () => forzarFigura('jvlix', 10), e: () => forzarFigura('Elite', 10),
    k: () => forzarFigura('Señora K', 10), y: () => forzarFigura('Yakuruna', 10),
    v: () => forzarFigura('vaciar', 12), p: () => fijarPausa(!pausa), h: () => hablarSimulado(4000),
    r: () => restaurar(),
  };
  if (k >= '1' && k <= '5') { manual = true; aplicarEstado(ids[Number(k) - 1]); }
  else if (acc[k]) { manual = true; acc[k](); }
  else return;
  rotulo('manual · 1-5 perfil · A D N rumbo · S silencio · J E K Y figura · V vaciar · P pausa · H voz · R re-habitar');
});

/* ═══ ARRANQUE ═══ */
(async function () {
  redim();
  await cargarTodo();
  if (!CAB.size) { document.getElementById('carga').textContent = 'sin imágenes en /clon-img/'; return; }
  ajustarElenco();
  componerDeCero();
  listo = true;
  document.getElementById('carga').classList.add('oculto');
  if (DIAG) { document.getElementById('diag').style.display = 'block'; setInterval(diagnostico, 250); }
  // Celular 2 (solo, sin el permiso de autoplay de la TV): Android no deja
  // analizar el audio hasta el primer toque. Mientras tanto, lo pide en
  // pantalla. En la escena compuesta nunca aparece.
  if (!EMBEBIDO && !DEMO) setInterval(() => {
    const bloqueado = !actx || actx.state !== 'running';
    document.getElementById('toque').style.display = bloqueado ? 'block' : 'none';
  }, 1000);
  // El demo es una vista previa autónoma: no escucha al servidor (si no, el
  // último estado de la escena le pisa los pasos).
  if (!DEMO) conectar();
  requestAnimationFrame(cuadro);
  if (DEMO) demo();
})();
</script>
