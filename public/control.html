<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>PROTOUSUARIO · control</title>
<style>
  /* Interfaz de control del performer. Pensada para el pulgar, a oscuras,
     bajo presión escénica: botones enormes, alto contraste, sin scroll. */
  :root{--bg:#05080a;--accent:#55ffa6;--dim:#2b6b49;--text:#d9ffe9;--alert:#ff6b4a;
        --font:ui-monospace,'Cascadia Code','Roboto Mono',Consolas,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--font);overscroll-behavior:none;user-select:none;}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:10px;}

  .estado{padding:12px 4px 8px;border-bottom:1px solid var(--dim);}
  .estado .agente{font-size:19px;color:var(--accent);letter-spacing:.04em;}
  .estado .linea{font-size:12px;opacity:.72;margin-top:5px;line-height:1.45;}
  .estado .marca{font-size:13px;margin-top:6px;}
  .estado .marca.autorizado{color:var(--accent);}
  .estado .marca.desplazado{color:var(--alert);}
  .progreso{font-size:11px;opacity:.5;letter-spacing:.16em;margin-top:6px;}

  .segmento{flex:1;overflow-y:auto;padding:12px;border:1px solid var(--dim);
    border-radius:10px;font-size:16px;line-height:1.55;min-height:90px;
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;}
  .segmento .tipo{display:block;font-family:var(--font);font-size:10px;
    letter-spacing:.22em;color:var(--accent);opacity:.8;margin-bottom:8px;}

  .botonera{display:flex;flex-direction:column;gap:9px;padding-bottom:8px;}
  button{font-family:var(--font);border:none;border-radius:12px;
    padding:20px;font-size:17px;letter-spacing:.06em;color:var(--bg);
    background:var(--accent);transition:transform .08s,opacity .15s;}
  button:active{transform:scale(.97);opacity:.75;}
  .fila{display:flex;gap:9px;}
  .fila button{flex:1;padding:15px;font-size:13px;background:transparent;
    color:var(--accent);border:1px solid var(--dim);}
  /* v7 — botones más chicos: el texto manda, no la botonera */
  button{padding:11px 8px;font-size:13px;letter-spacing:.05em;}
  #btnAvanzar{padding:15px;font-size:16px;}
  #btnRetro{padding:15px;font-size:16px;background:transparent;
    color:var(--accent);border:1px solid var(--dim);}
  .fila{gap:7px;}

  /* ── LISTA NAVEGABLE (tipo Speechify) ──
     Todo el texto del agente queda impreso. Se recorre con el dedo y se toca
     una línea para saltar a ella. La línea que suena va resaltada y la lista
     se desplaza sola para mantenerla a la vista. */
  .lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--dim);border-radius:12px;padding:4px;margin-bottom:8px;}
  .lin{padding:9px 11px;border-radius:9px;margin:2px 0;cursor:pointer;
    font-size:14px;line-height:1.45;opacity:.42;
    border-left:2px solid transparent;transition:opacity .15s;}
  .lin:active{background:rgba(255,255,255,.07);}
  .lin.dicho{opacity:.3;}
  .lin.ahora{opacity:1;background:rgba(255,255,255,.05);
    border-left-color:var(--accent);font-size:15px;}
  .lin .t{display:block;font-family:var(--font);font-size:9px;
    letter-spacing:.18em;opacity:.5;margin-bottom:3px;}
  .lin[data-tipo="prompt"] .t{color:var(--accent);}
  .lin[data-tipo="pregunta"]{font-style:italic;}
  .lin[data-tipo="pregunta"] .t{color:#c9a6ff;}
  .lin[data-tipo="sonido"] .t{color:#ffc65f;}
  .lin[data-tipo="orbital"] .t, .lin[data-tipo="narracion"] .t,
  .lin[data-tipo="memoria"] .t{color:#8fb6a2;}
  #btnTerminar{background:transparent;color:var(--alert);border:1px solid var(--alert);
    padding:12px;font-size:12px;}
  /* PAUSA: segundo botón en tamaño, porque en escena se usa de verdad.
     Cuando está activo se pinta entero y AVANZAR se atenúa, para que a
     oscuras y de un vistazo sepas en qué estado estás. */
  #btnPausa{background:transparent;color:#ffc65f;border:1px solid #8a6520;
    padding:20px;font-size:16px;}
  body[data-pausa="1"] #btnPausa{background:#ffc65f;color:var(--bg);border-color:#ffc65f;}
  body[data-pausa="1"] #btnAvanzar{opacity:.3;}
  body[data-pausa="1"] .estado{border-bottom-color:#ffc65f;}
  /* (el bloque de arriba ya define #btnPausa; aquí solo lo que faltaba) */
  body[data-pausa="1"] #btnPausa::after{content:' · ACTIVA';}
  body[data-pausa="1"] .segmento{border-color:#ffc65f;opacity:.55;}
  /* ── v6: modo y velocidad ── */
  .grupo{border:1px solid var(--dim);border-radius:11px;padding:9px;margin:2px 0;}
  .rotulo{font-size:9px;letter-spacing:.26em;opacity:.45;text-align:center;
    margin-bottom:7px;text-transform:uppercase;}
  .segmentado{display:flex;gap:0;border:1px solid var(--dim);border-radius:9px;overflow:hidden;}
  .segmentado button{flex:1;padding:13px 4px;font-size:12px;letter-spacing:.06em;
    background:transparent;border:none;border-right:1px solid var(--dim);}
  .segmentado button:last-child{border-right:none;}
  .segmentado button.on{background:var(--accent);color:var(--bg);font-weight:600;}
  .vel{display:flex;align-items:center;gap:9px;}
  .vel button{width:56px;padding:13px 0;font-size:20px;background:transparent;
    border:1px solid var(--dim);border-radius:9px;}
  #velValor{flex:1;text-align:center;font-size:22px;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;}
  #velValor small{display:block;font-size:9px;letter-spacing:.2em;opacity:.4;}
  .conexion{font-size:11px;letter-spacing:.14em;text-align:center;opacity:.55;padding-bottom:4px;}
  .conexion.caida{color:var(--alert);opacity:1;font-size:13px;}
  .conexion.local{color:#ffc65f;opacity:1;font-size:13px;}
  .buffer{font-size:10px;opacity:.4;letter-spacing:.1em;text-align:center;}
</style>
</head>
<body>
  <div class="estado">
    <div class="agente" id="agente">— esperando —</div>
    <div class="linea" id="territorio"></div>
    <div class="marca" id="marca"></div>
    <div class="progreso" id="progreso"></div>
  </div>

  <div class="lista" id="lista">
    <div class="lin ahora"><span class="t">EN ESPERA</span>
      Arranca el orquestador en la laptop y pulsa AVANZAR.</div>
  </div>

  <div class="botonera">
    <div class="fila">
      <button id="btnRetro">◀  ATRÁS</button>
      <button id="btnAvanzar">AVANZAR  ▶</button>
    </div>
    <div class="fila">
      <button id="btnPausa">⏸ PAUSA</button>
      <button id="btnRepetir">↺ REPETIR</button>
    </div>
    <div class="grupo">
      <div class="rotulo">reproducción</div>
      <div class="segmentado">
        <button id="btnAuto" class="on">▶▶ AUTOMÁTICO</button>
        <button id="btnManual">▐▐ MANUAL</button>
      </div>
    </div>

    <div class="grupo">
      <div class="rotulo">velocidad de la voz</div>
      <div class="vel">
        <button id="velMenos">−</button>
        <div id="velValor">1.00×<small>toca el número para volver a 1</small></div>
        <button id="velMas">+</button>
      </div>
    </div>

    <button id="btnTerminar">■ TERMINAR PERFORMANCE</button>
  </div>
  <div class="conexion" id="conexion">conectando…</div>
  <div class="buffer" id="buffer"></div>

<script>
const el = (id) => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════════════
//  RESPALDO SIN RED
//  Si te alejás y el hotspot se corta, este teléfono NO se queda en blanco:
//  guarda la secuencia completa del manifiesto en cuanto llega, y AVANZAR
//  sigue mostrándote los textos que faltan aunque el servidor no responda.
//  Al volver al alcance, el WebSocket se reconecta solo y se re-sincroniza.
// ═══════════════════════════════════════════════════════════════════════
let secuencia = [], iLocal = 0, enLinea = false, modoLocal = false;
let bloqueActual = -1;

function pintarConexion(){
  const c = el('conexion');
  c.className = 'conexion' + (enLinea ? '' : (modoLocal ? ' local' : ' caida'));
  c.textContent = enLinea ? 'conectado'
    : (modoLocal ? '⚠ SIN RED — avanzando local' : 'reconectando…');
  el('buffer').textContent = secuencia.length
    ? `respaldo: ${Math.min(iLocal, secuencia.length)}/${secuencia.length} segmentos`
    : '';
}

async function enviar(comando){
  if (navigator.vibrate) navigator.vibrate(comando==='terminar'?[60,40,60]:25);
  try{
    const r = await fetch('/control', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({comando}), signal: AbortSignal.timeout(2500)});
    if(!r.ok) throw new Error('http');
    modoLocal = false; pintarConexion();
  }catch(e){
    // Sin red: si es AVANZAR y hay respaldo, se avanza en el teléfono.
    modoLocal = true;
    if (comando === 'avanzar' && secuencia.length){
      const seg = secuencia[Math.min(iLocal, secuencia.length-1)];
      if (seg) pintarSegmento(seg.tipo, seg.texto);
      iLocal++;
      if (navigator.vibrate) navigator.vibrate([20,40,20]);
    }
    pintarConexion();
  }
}

el('btnAvanzar').onclick = () => {
  document.body.dataset.pausa='';
  // Se adelanta el resaltado sin esperar la respuesta: el botón se siente
  // inmediato aunque la red tarde. Si el servidor manda otra cosa, corrige.
  if (secuencia.length && bloqueActual < secuencia.length - 1) { bloqueActual++; pintarLista(); }
  enviar('avanzar');
};
el('btnPausa').onclick   = () => {
  const activa = document.body.dataset.pausa === '1';
  document.body.dataset.pausa = activa ? '' : '1';
  if (navigator.vibrate) navigator.vibrate(activa ? 25 : [40,60,40]);
  enviar('pausa');
};
// ── MODO ──
// AUTOMÁTICO: la obra corre sola, cada bloque pasa cuando su voz termina.
// MANUAL: vuelve al botón a botón. AVANZAR funciona en los dos.
function pintarModo(auto){
  el('btnAuto').classList.toggle('on', auto);
  el('btnManual').classList.toggle('on', !auto);
}
el('btnAuto').onclick   = () => { pintarModo(true);  enviar('auto'); };
el('btnManual').onclick = () => { pintarModo(false); enviar('manual'); };

// ── VELOCIDAD ──
// Pasos finos cerca de 1× (donde se nota) y más gruesos en los extremos.
const PASOS = [0.50,0.60,0.70,0.75,0.80,0.85,0.90,0.95,1.00,
               1.05,1.10,1.15,1.20,1.30,1.40,1.50,1.75,2.00];
let iVel = PASOS.indexOf(1.00);
function pintarVel(){
  el('velValor').innerHTML = PASOS[iVel].toFixed(2)
    + '×<small>toca el número para volver a 1</small>';
}
function mandarVel(){ pintarVel(); enviar('velocidad:' + PASOS[iVel].toFixed(2)); }
el('velMenos').onclick = () => { if(iVel>0){ iVel--; mandarVel(); } };
el('velMas').onclick   = () => { if(iVel<PASOS.length-1){ iVel++; mandarVel(); } };
el('velValor').onclick = () => { iVel = PASOS.indexOf(1.00); mandarVel(); };

el('btnRepetir').onclick = () => enviar('repetir');
// ATRÁS: vuelve al bloque anterior. Es lo que faltaba cuando apretabas
// AVANZAR varias veces por impaciencia y se te iban tres líneas de golpe.
el('btnRetro').onclick = () => {
  if (bloqueActual > 0) { bloqueActual--; pintarLista(); }
  enviar('retroceder');
};
el('btnTerminar').onclick= () => { if(confirm('¿TERMINAR la performance?')) enviar('terminar'); };

// Espacio y flecha derecha también avanzan (por si usas teclado bluetooth)
addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); document.body.dataset.pausa=''; enviar('avanzar'); }
  if (e.code==='KeyP'){ e.preventDefault(); el('btnPausa').click(); }
});

function pintarEstado(d){
  if(!d) return;
  if(d.agente) el('agente').textContent = d.agente;
  if(d.territorio) el('territorio').textContent = d.territorio;
  if(d.estado_marca){
    el('marca').textContent = d.estado_marca;
    el('marca').className = 'marca ' + (d.estado_marca.includes('AUTORIZADO')?'autorizado':'desplazado');
  }
  if(d.progreso) el('progreso').textContent = d.progreso;
}
// ═══════════════════════════════════════════════════════════════════════
//  LISTA NAVEGABLE
//  El servidor manda la secuencia COMPLETA del agente en cuanto se arma
//  (evento 'secuencia'). Aquí se imprime entera: recorres con el dedo y
//  tocas una línea para saltar a ella. La que suena va resaltada.
//  Esto también es tu red si se cae el hotspot: el texto ya está aquí.
// ═══════════════════════════════════════════════════════════════════════
const NOMBRE_TIPO = {
  orbital:'DATO ORBITAL', memoria:'memoria episódica', prompt:'▌ PROMPT',
  narracion:'narración NatGeo', reflexion:'narración NatGeo',
  pregunta:'◈ PREGUNTA — AL MICRÓFONO', sonido:'♪ SONIDO', id_agente:'▌ ID',
};

function pintarLista(){
  const cont = el('lista');
  cont.innerHTML = '';
  if(!secuencia.length){
    cont.innerHTML = '<div class="lin ahora"><span class="t">EN ESPERA</span>'
      + 'Arranca el orquestador en la laptop y pulsa AVANZAR.</div>';
    return;
  }
  secuencia.forEach((seg, k) => {
    const d = document.createElement('div');
    d.className = 'lin' + (k === bloqueActual ? ' ahora' : (k < bloqueActual ? ' dicho' : ''));
    d.dataset.tipo = seg.tipo;
    d.dataset.i = k;
    d.innerHTML = `<span class="t">${k+1}. ${NOMBRE_TIPO[seg.tipo] ?? seg.tipo}</span>`
      + (seg.texto ? seg.texto.replace(/</g,'&lt;') : (seg.sonido ? seg.sonido : '—'));
    // Tocar una línea = ir a ella. Confirmación corta para no saltar por error
    // con el pulgar mientras haces otra cosa en escena.
    d.onclick = () => {
      if (k === bloqueActual) return;
      if (navigator.vibrate) navigator.vibrate(18);
      bloqueActual = k; pintarLista();
      enviar('ir:' + k);
    };
    cont.appendChild(d);
  });
  const activa = cont.querySelector('.lin.ahora');
  if (activa) activa.scrollIntoView({ block:'center', behavior:'smooth' });
}

function pintarSegmento(tipo, texto){
  // Si el texto está en la secuencia, se resalta esa línea. Si no (preludio,
  // deriva), se añade al final para que también se pueda recorrer.
  const k = secuencia.findIndex((x) => x.texto === texto);
  if (k >= 0) bloqueActual = k;
  else {
    secuencia.push({ tipo, texto });
    bloqueActual = secuencia.length - 1;
  }
  pintarLista();
}


function conectar(){
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => {
    enLinea = true; modoLocal = false; pintarConexion();
    // Avisar que soy el control: así el servidor no me manda la nube de
    // satélites, que son cientos de KB por segundo a través del hotspot.
    try { ws.send(JSON.stringify({ soy: 'control' })); } catch {}
  };
  ws.onmessage = (e) => {
    let m; try{ m=JSON.parse(e.data);}catch{return;}
    if(m.tipo==='segmento'){
      pintarSegmento(m.datos.tipo, m.datos.texto);
      // sincronizar el puntero local con lo que ya sonó de verdad
      const k = secuencia.findIndex(s=>s.texto===m.datos.texto);
      if(k>=0) iLocal = k+1;
      pintarConexion();
    }
    if(m.tipo==='secuencia'){
      secuencia = m.datos.segmentos || []; iLocal = 0; bloqueActual = -1;
      pintarLista(); pintarConexion();
    }
    if(m.tipo==='pausa'){ document.body.dataset.pausa = m.datos.activa ? '1' : ''; }
    if(m.tipo==='modo') pintarModo(!!m.datos.auto);
    if(m.tipo==='bloque' && typeof m.datos.i === 'number'){
      bloqueActual = m.datos.i; pintarLista();
    }
    if(m.tipo==='velocidad'){
      const k = PASOS.indexOf(Number(m.datos.valor));
      if(k>=0){ iVel = k; pintarVel(); }
    }
    if(m.tipo==='deriva' && m.datos.activa){
      document.body.dataset.deriva='1';
      el('agente').textContent='DERIVA — pasaje final';
    }
    if(m.tipo==='control_estado') pintarEstado(m.datos);
    if(m.tipo==='preludio'){ el('agente').textContent='PRELUDIO'; pintarSegmento('orbital', m.datos.texto||''); }
    if(m.tipo==='agente_id'){ el('agente').textContent=m.datos.nombre||''; pintarSegmento('orbital', m.datos.texto||''); }
  };
  ws.onclose = () => { enLinea = false; pintarConexion(); setTimeout(conectar,1200); };
  ws.onerror = () => { enLinea = false; pintarConexion(); };
}
conectar();
// Mantener la pantalla encendida durante la función (Android Chrome).
try { navigator.wakeLock?.request?.('screen'); } catch {}
if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
fetch('/control/estado').then(r=>r.json()).then(pintarEstado).catch(()=>{});
</script>
</body>
</html>
