<!DOCTYPE html>
<html lang="es" data-estado="PANOPTICO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGENTE-ESPEJO — Escena compuesta</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="escena">

  <!-- ══ ZONA IZQUIERDA: rastreo satelital orbital ══ -->
  <section class="zona-globo">
    <div id="globo"></div>
    <div class="scanlines"></div>

    <div class="panel-telemetria">
      <div><span class="etiqueta">SATÉLITE</span><span id="tSatelite">—</span></div>
      <div><span class="etiqueta">LAT/LON</span><span id="tCoords">—</span></div>
      <div><span class="etiqueta">ALT</span><span id="tAlt">—</span> km</div>
      <div><span class="etiqueta">ELEV</span><span id="tElev">—</span>°</div>
      <div class="estado-afectivo" id="tEstado">—</div>
    </div>

    <div class="banner-territorio" id="bannerTerritorio">
      <span class="tipo" id="bTipo">TERRITORIO</span>
      <span class="detalle" id="bDetalle"></span>
      <span id="bNombre">—</span>
      <span class="region-conflicto" id="bRegion"></span>
    </div>

    <div class="rosa-vientos" id="rosaVientos" data-estado="DESPLAZADO">
      <svg viewBox="0 0 100 100" class="rosa-svg">
        <circle cx="50" cy="50" r="34" class="rosa-anillo" />
        <circle cx="50" cy="50" r="24" class="rosa-anillo tenue" />
        <g class="rosa-cruz"><line x1="50" y1="12" x2="50" y2="88" /><line x1="12" y1="50" x2="88" y2="50" /></g>
        <g class="rosa-diagonales"><line x1="26" y1="26" x2="74" y2="74" /><line x1="74" y1="26" x2="26" y2="74" /></g>
        <polygon points="50,14 46,50 50,44 54,50" class="rosa-aguja" id="rosaAguja" />
        <circle cx="50" cy="50" r="2.6" class="rosa-centro" />
      </svg>
      <span class="rosa-letra n" id="rosaN">N</span>
      <span class="rosa-letra e" id="rosaE">E</span>
      <span class="rosa-letra s" id="rosaS">S</span>
      <span class="rosa-letra o" id="rosaO">O</span>
      <span class="rosa-estado" id="rosaEstado"></span>
    </div>

    <div class="indicador-salud">
      <span class="punto" id="puntoSalud"></span><span id="textoSalud">—</span>
    </div>
  </section>

  <!-- ══ ZONA DERECHA ══ -->
  <section class="zona-derecha">

    <!-- superior: prompt-manifiesto, escrito como a máquina -->
    <div class="panel-texto" id="panelTexto">
      <div class="panel-cabecera">
        <span id="cabAgente">—</span>
        <span id="cabMarca" class="marca"></span>
      </div>
      <div class="corrido" id="corrido"></div>
    </div>

    <!-- inferior: dos pantallas -->
    <div class="zona-inferior">
      <div class="panel-clon" id="panelClon">
        <div class="panel-titulo">CLON TRANSESPECIE</div>
        <div class="placeholder" id="phClon">
          <span>ventana reservada</span>
          <small>fuente de video / OBS</small>
        </div>
      </div>
      <div class="panel-zoom" id="panelZoom">
        <div class="panel-titulo">PLANO SATÉLITE</div>
        <div id="globoZoom"></div>
      </div>
    </div>

  </section>
</div>

<!-- globe.gl trae su propio three.js: NO cargar three por separado -->
<script src="vendor/globe.gl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
